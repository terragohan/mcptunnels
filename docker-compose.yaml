services:
  tunneld:
    build:
      context: .
      target: tunneld
    ports:
      - "443:443"   # TLS + ACME TLS-ALPN-01
    volumes:
      - ./data:/data   # tunneld.yaml, SQLite DB, ACME cache
    restart: unless-stopped

  # Example: a sidecar agent + MCP server on an internal network.
  # The agent dials OUTBOUND to tunneld — no published ports needed.
